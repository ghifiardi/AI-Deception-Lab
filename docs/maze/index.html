<style>
/* Layout: story cards between chapters; during play a maze canvas (left) beside a mission panel (right), stacking on phones.
   Deliberately single dark theme: the lab's night-shift console. Amber = the AI agent, violet = traps, cyan = real routes, green = defense. */
:root{
  color-scheme:dark;
  --bg:#0e1a26; --panel:#15243a; --panel2:#1b2e47; --line:#2a4562; --fg:#e7eef3; --muted:#9fb3c4;
  --amber:#f2a541; --violet:#a894f7; --green:#6bd49b; --red:#ff7a7a; --cyan:#47c4cb;
  --display:"Chakra Petch","Avenir Next Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:700 24px var(--display);letter-spacing:.02em;margin:0}
.brand h1 span{color:var(--amber)}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--amber);color:var(--amber)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border:0;padding:6px 10px;font:500 13px var(--mono);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.btn{background:var(--amber);color:#1a1205;border:0;border-radius:10px;padding:11px 18px;font:600 15px var(--body);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan)}
.fine{font-size:13px;color:var(--muted)}

/* title */
.title{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:18px}
.kicker{font:500 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.title h2{font:700 clamp(34px,5.2vw,58px)/1.02 var(--display);margin:10px 0 14px;text-wrap:balance}
.title h2 em{font-style:normal;color:var(--amber)}
.title p{color:var(--muted);font-size:17px;max-width:54ch;margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chlist{display:grid;gap:6px;margin-top:18px}
.chlist button{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.chlist button b{font:600 12px var(--mono);color:var(--amber);min-width:34px}
.chlist button:disabled{opacity:.4;cursor:not-allowed}
.chlist button span.s{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}

/* story */
.story{max-width:760px;margin:6vh auto 0;width:100%}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 26px 20px;min-height:250px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--display);flex:none}
.who b{font:600 13px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.say{font-size:clamp(18px,2.3vw,22px);line-height:1.45;margin:0;text-wrap:pretty}
.say.chapter{font:700 clamp(28px,4vw,44px)/1.1 var(--display);color:var(--fg)}
.say.lesson{border-left:4px solid var(--amber);padding-left:14px}
.pips{display:flex;gap:6px;margin-top:auto}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--amber)}
.snav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}

/* play */
.play{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative;min-width:0}
.mapbox canvas{display:block;margin:0 auto;touch-action:none;border-radius:6px}
.obj{font-size:14px;color:var(--muted);padding:2px 4px 8px}
.obj b{color:var(--fg)}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:700 clamp(22px,4vw,40px) var(--display);letter-spacing:.04em;padding:10px 22px;border-radius:12px;background:rgba(14,26,38,.88);border:2px solid currentColor;pointer-events:none;white-space:nowrap}
.toast{position:absolute;left:12px;right:12px;top:44px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:rgba(21,36,58,.95);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:8px;padding:8px 10px;font-size:13px;animation:fade 4.2s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.modal{position:absolute;inset:0;background:rgba(8,14,22,.72);display:grid;place-items:center;padding:14px;border-radius:14px}
.modal .box{background:var(--panel);border:1px solid var(--amber);border-radius:14px;padding:16px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal h3{margin:0;font:700 19px var(--display)}
.modal p{margin:0;color:var(--muted);font-size:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.choices button:hover{border-color:var(--amber)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font:700 24px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--amber);transition:width .25s}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.key{font:500 12px var(--mono);padding:3px 8px;border-radius:6px;background:#33291a;color:var(--amber);border:1px solid #6a4d1e}
.thought{border-left:3px solid var(--amber);padding-left:10px;font-size:15px}
.loc{font:500 13px var(--mono);color:var(--cyan);margin-bottom:6px;word-break:break-all}
.log{font:12.5px/1.5 var(--mono);max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.log div{word-break:break-word}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)} .vio{color:var(--violet)} .cy{color:var(--cyan)}
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center;margin-top:10px}
.dpad button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;font-size:18px;cursor:pointer}
.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media (hover:none),(max-width:820px){.dpad{display:grid}}
.result h2{font:700 23px var(--display);margin:0 0 6px}
.result p{margin:0 0 10px;color:var(--muted)}
.opts{display:grid;gap:7px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--fg)}
.opt[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.opt .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;grid-row:span 2}
.opt b{font-size:14.5px}.opt span{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px}
.toggle button{min-width:64px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font:600 13.5px var(--mono);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.goals{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-top:8px}
.goals .done{color:var(--green)}
.tl{display:flex;gap:10px;font:13.5px var(--mono);margin:4px 0}
.tl time{color:var(--cyan);white-space:nowrap}

/* end */
.endgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.endgrid .card b{font:700 26px var(--display);color:var(--amber);display:block}
.big{font:700 clamp(28px,4vw,42px)/1.1 var(--display);margin:6px 0 4px;text-wrap:balance}
.score{font:700 clamp(40px,6vw,64px) var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
@media (max-width:980px){.endgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .play,.title{grid-template-columns:1fr}
  .brand h1{font-size:21px}
  .scard{padding:20px}
}
@media (max-width:480px){.endgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast div{animation:none}.meter i{transition:none}}
</style>
</head>

const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function genMaze(cw,chh,seed){const W=2*cw+1,H=2*chh+1,r=rng(seed);const g=Array.from({length:H},()=>Array(W).fill(1));const st=[[1,1]];g[1][1]=0;while(st.length){const [x,y]=st[st.length-1];const n=[[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([nx,ny])=>nx>0&&ny>0&&nx<W-1&&ny<H-1&&g[ny][nx]===1);if(!n.length){st.pop();continue}const [nx,ny,dx,dy]=n[Math.floor(r()*n.length)];g[y+dy/2][x+dx/2]=0;g[ny][nx]=0;st.push([nx,ny])}return{W,H,g}}

function deadEnds(m,path){const info=new Map(),q=[];const on=new Set(path.map(p=>p[1]*m.W+p[0]));path.forEach((p,i)=>{info.set(p[1]*m.W+p[0],{a:i,d:0});q.push(p)});while(q.length){const [x,y]=q.shift();const I=info.get(y*m.W+x);for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy,kk=ny*m.W+nx;if(m.g[ny][nx]===0&&!info.has(kk)){info.set(kk,{a:I.a,d:I.d+1});q.push([nx,ny])}}}const de=[];for(let y=1;y<m.H-1;y++)for(let x=1;x<m.W-1;x++){if(m.g[y][x])continue;const kk=y*m.W+x;if(on.has(kk))continue;if(D4.filter(([dx,dy])=>m.g[y+dy][x+dx]===0).length===1)de.push({x,y,...info.get(kk)})}return de}
function pick(de,used,target){let best=null;for(const e of de){const id=e.x+","+e.y;if(used.has(id)||e.d<2)continue;const s=Math.abs(e.a-target)+(e.d>10?40:0);if(!best||s<best.s)best={...e,s}}if(!best)best=de.find(e=>!used.has(e.x+","+e.y));used.add(best.x+","+best.y);return[best.x,best.y]}
const WORLD=(()=>{const m=genMaze(10,7,20261114);const S=[1,1],V=[m.W-2,m.H-2];const path=bfs(m,S,V);const de=deadEnds(m,path);const used=new Set();const n=path.length;
  return{m,S,V,path,L:path[Math.floor(n*.55)],txt:pick(de,used,3),int:pick(de,used,n*.38),bak:pick(de,used,n*.7),hp:pick(de,used,n*.2)}})();
const W1=(()=>{const m=genMaze(7,5,1311);const S=[1,1],V=[m.W-2,m.H-2];const path=bfs(m,S,V);return{m,S,V,path,root:path[2]}})();

const COL={bg:"#0e1a26",wall:"#22395a",wallE:"#2f4d72",fog:"#070d14",room:"#132c45",roomS:"#3b7290",amber:"#f2a541",amberF:"#3a2a12",violet:"#a894f7",violetF:"#211f3f",cyan:"#47c4cb",green:"#6bd49b",greenF:"#163a2c",red:"#ff7a7a",grey:"#4a5868",greyF:"#1a2230",fg:"#e7eef3",muted:"#9fb3c4"};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function itemStyle(type){

  const room={f:COL.room,s:COL.roomS,c:COL.fg}, vio={f:COL.violetF,s:COL.violet,c:COL.violet}, amb={f:COL.amberF,s:COL.amber,c:COL.amber}, cy={f:COL.room,s:COL.cyan,c:COL.cyan}, gr={f:COL.greyF,s:COL.grey,c:COL.muted};

function viewItems(){

    if(!seen(x,y)){ctx.fillStyle=COL.fog;ctx.fillRect(x*T,y*T,T,T);continue}
    if(m.g[y][x]){ctx.fillStyle=COL.wall;ctx.fillRect(x*T,y*T,T,T);ctx.fillStyle=COL.wallE;ctx.fillRect(x*T,y*T,T,Math.max(1,T*.08))}

  }

  if(G.ch>0&&G.screen!=="title"&&G.screen!=="end"){c.hidden=false;c.textContent=`${t("ch")} ${G.ch}/5 · ${t("c")[G.ch]}`;c.classList.add("on")}else c.hidden=true;
  document.getElementById("len").setAttribute("aria-pressed",lang==="en");document.getElementById("lid").setAttribute("aria-pressed",lang==="id");
  document.documentElement.lang=lang;
}
function toast(msg,col){const box=document.getElementById("toasts");if(!box)return;const d=document.createElement("div");d.textContent=msg;if(col)d.style.borderLeftColor=col;box.appendChild(d);setTimeout(()=>d.remove(),4300)}
function banner(text,col){const mb=document.querySelector(".mapbox");if(!mb)return;let b=mb.querySelector(".banner");if(!b){b=document.createElement("div");b.className="banner";mb.appendChild(b)}b.textContent=text;b.style.color=col}

/* ===================== screens ===================== */
function render(){
  chipSet();
  if(G.screen==="title")return renderTitle();
  if(G.screen==="story")return renderStory();
  if(G.screen==="play")return renderPlay();
  if(G.screen==="end")return renderEnd();
}
function renderTitle(){
  const resume=prog.unlocked>1&&prog.scores[5]==null;
  app.innerHTML=`<section class="title"><div>
    <div class="kicker">${t("kicker")}</div><h2>${t("hook")}</h2><p>${t("intro")}</p>
    <div class="row"><button class="btn" id="go">${t("start")}</button>${resume?`<button class="btn ghost" id="res">${fm(t("resume"),{n:prog.unlocked})}</button>`:""}<a href="${SHORT}" target="_blank" rel="noopener" class="fine">${t("shortGame")}</a></div>
    <div class="chlist" aria-label="${t("chapters")}">${[1,2,3,4,5].map(n=>`<button data-ch="${n}" ${n>prog.unlocked?"disabled":""}><b>${String(n).padStart(2,"0")}</b>${t("c")[n]}<span class="s">${n>prog.unlocked?t("locked"):(prog.scores[n]!=null?prog.scores[n]+" pts":"")}</span></button>`).join("")}</div>
  </div><div class="mapbox"><canvas id="cv" role="img" aria-label="Network maze"></canvas></div></section>`;
  mountCanvas();
  document.getElementById("go").onclick=()=>startChapter(1);
  const r=document.getElementById("res");if(r)r.onclick=()=>startChapter(prog.unlocked);
  app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>startChapter(+b.dataset.ch));
}
/* story */
const INTRO={1:"pro",2:"c1end",3:"c3intro",4:"c4intro",5:"c5intro"};
const AV={nar:["·","#1b2e47","#9fb3c4"],op:["OP","#3a1a1e","#ff7a7a"],sari:["S","#163a2c","#6bd49b"],k7:["K7","#3a2a12","#f2a541"],lesson:["!","#33291a","#f2a541"]};
function renderStory(){
  const S=G.story, lines=TX[lang].st[S.key];
  let body;
  if(S.i<0){body=`<div class="who"><div class="avatar" style="background:#1b2e47;color:#a894f7">${S.ch}</div><b style="color:var(--violet)">${t("ch")} ${S.ch}/5</b></div><p class="say chapter">${t("c")[S.ch]}</p><p class="fine" style="margin:0;font-size:15px">${t("o")[S.ch]}</p>`}
  else{const [sp,txt]=lines[S.i];const a=AV[sp];
    body=`<div class="who">${sp==="nar"?"":`<div class="avatar" style="background:${a[1]};color:${a[2]}">${a[0]}</div><b style="color:${a[2]}">${t("sp")[sp]}</b>`}</div><p class="say${sp==="lesson"?" lesson":""}">${esc(txt)}</p>`}
  const total=lines.length+(S.withTitle?1:0), cur=S.i+(S.withTitle?1:0);
  app.innerHTML=`<section class="story"><div class="scard" aria-live="polite">${body}
    <div class="pips">${Array.from({length:total},(_,k)=>`<i class="${k<=cur?"on":""}"></i>`).join("")}</div></div>
    <div class="snav"><button class="btn ghost sm" id="skip">${t("skip")}</button><button class="btn" id="nx">${t("next")} ▸</button></div></section>`;
  const adv=()=>{if(S.i<lines.length-1){S.i++;renderStory()}else S.done()};
  document.getElementById("nx").onclick=adv;document.getElementById("nx").focus();
  document.getElementById("skip").onclick=()=>S.done();
}
function startChapter(n){
  G.ch=n; G.c4=null; G.c5=null; G.P=null;
  if(n>prog.unlocked){prog.unlocked=n;save()}
  const key=INTRO[n];
  /* chapter title slide is shown after the intro lines: put title first for ch1, else lines then title */
  G.screen="story";G.story={key,i:0,ch:n,withTitle:false,done:()=>{G.story={key:"_t",i:-1,ch:n,withTitle:true,done:()=>beginPlay(n)};TX.en.st._t=[];TX.id.st._t=[];G.story.i=-1;renderStoryTitle()}};
  render();
}
function renderStoryTitle(){
  const n=G.story.ch;
  app.innerHTML=`<section class="story"><div class="scard"><div class="who"><div class="avatar" style="background:#1b2e47;color:#a894f7">${n}</div><b style="color:var(--violet)">${t("ch")} ${n}/5</b></div><p class="say chapter">${t("c")[n]}</p><p class="fine" style="margin:0;font-size:15px">${t("o")[n]}</p></div>
  <div class="snav"><span></span><button class="btn" id="nx">${t("cont")} ▸</button></div></section>`;
  chipSet();
  const b=document.getElementById("nx");b.focus();b.onclick=()=>beginPlay(n);
}
function finishChapter(n,score,outroKey){
  prog.scores[n]=Math.max(score,prog.scores[n]||0);
  if(n<5&&prog.unlocked<n+1)prog.unlocked=n+1; save();
  const go=()=>{if(n<5)startChapter(n+1);else{G.screen="end";render()}};
  if(outroKey){G.screen="story";G.story={key:outroKey,i:0,ch:n,done:go};render()}else go();
}

/* ===================== chapters 1–3: you are the agent ===================== */
function beginPlay(n){
  G.screen="play";G.ch=n;
  if(n<=3){
    const S=n===1?W1.S:WORLD.S;
    G.P={x:S[0],y:S[1],seen:new Set(),trail:new Set(),budget:n===1?70:n===2?120:95,max:n===1?70:n===2?120:95,alarms:0,keys:[],log:[],th:"start",loc:null,over:null,modal:false,reveal:false,got:{},page:1};
    G.P.ent={x:S[0],y:S[1],dx:S[0],dy:S[1],label:"K7",glow:1};
    see();
  }
  if(n===4)G.c4={mode:null,decoys:true,res:{},running:false,agents:[],last:null};
  if(n===5)initC5();
  render();
}
function see(){const P=G.P,m=curMaze();for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=P.x+dx,y=P.y+dy;if(x>=0&&y>=0&&x<m.W&&y<m.H)P.seen.add(x+","+y)}P.trail.add(P.x+","+P.y)}
function itemAt(x,y){for(const [type,p] of viewItems())if(p[0]===x&&p[1]===y)return type;return null}
function move(dx,dy){
  const P=G.P;if(!P||P.over||P.modal||G.screen!=="play"||G.ch>3)return;
  const m=curMaze(),nx=P.x+dx,ny=P.y+dy;if(!m.g[ny]||m.g[ny][nx]!==0)return;
  P.x=nx;P.y=ny;P.ent.x=nx;P.ent.y=ny;P.budget--;see();
  const it=itemAt(nx,ny);P.loc=it;
  if(it)onEnter(it);
  if(!P.over&&P.budget<=0)endRun("budget");
  renderPanel();
}
function addLog(msg,cls){G.P.log.unshift({msg,cls});G.P.log=G.P.log.slice(0,8)}
function onEnter(it){
  const P=G.P,R=t("r"),ch=G.ch;
  const first=!P.got[it];P.got[it]=true;
  switch(it){
    case "root":if(first){addLog(R.root,"ok");P.th="root"}break;
    case "api":addLog(R.api,"ok");P.th="api";endRun("win");break;
    case "txt":addLog(R.txt,"ok");P.th="txt";break;
    case "dbg":if(ch===2&&!P.keys.includes("real")){P.keys.push("real");addLog(R.dbg,"warn")}else if(ch===3&&!P.keys.includes("dbg3")){P.keys.push("dbg3");addLog(R.dbg3,"warn")}P.th="dbg";break;
    case "bak":if(!P.keys.includes("bak")){P.keys.push("bak");P.alarms++;addLog(R.bak,"warn")}P.th="bak";break;
    case "int":P.alarms++;P.budget-=8;addLog(fm(R.int,{p:P.page,q:P.page+1}),"vio");P.page++;P.th="int";break;
    case "vault":P.th="vault";P.modal=true;break;
  }
  if(P.alarms>=3&&!P.over)endRun("tarpit");
}
function useKey(k){
  const P=G.P,R=t("r");P.modal=false;
  if(k==="back"){renderPanel();return}
  P.budget--;
  if(k==="real"){addLog(R.ok,"ok");endRun("win")}
  else if(k==="bak"||k==="dbg3"){addLog(R.canary,"bad");P.ent.ring=1;endRun("caught")}
  else{P.budget-=2;addLog(R.k401,"bad");if(P.budget<=0)endRun("budget")}
  renderPanel();
}
function endRun(kind){
  const P=G.P;P.over=kind;P.modal=false;
  if(G.ch>=2){P.reveal=true}
  const col=kind==="win"?COL.amber:COL.red;
  if(G.ch===1)setTimeout(()=>{const sc=50+Math.max(0,Math.min(50,P.budget));finishChapter(1,sc,null)},900);
  banner(G.ch===1?"/openapi.json":t("out")[kind].toUpperCase(),G.ch===1?COL.cyan:col);
  renderPanel();
}
function playPanelHTML(){
  const P=G.P, R=TX[lang].room, kn={real:R.dbg,dbg3:R.dbg,bak:R.bak};
  const pct=Math.max(0,P.budget)/P.max*100;
  let s=`<div class="card"><div class="stats">
    <div class="stat"><b>${Math.max(0,P.budget)}</b><span>${t("budget")}</span><div class="meter"><i style="width:${pct}%"></i></div></div>
    <div class="stat"><b style="color:${P.alarms?"var(--violet)":"inherit"}">${G.ch===1?"–":P.alarms+"/3"}</b><span>${t("alarms")}</span></div>
    <div class="stat"><b>${P.keys.length}</b><span>${t("keys")}</span></div></div>
    <div class="keys">${P.keys.length?P.keys.map(k=>`<span class="key">${k==="real"?"rk_7f3a91…":k==="dbg3"?"rk_9b0d55…":"bk_c21e04…"}</span>`).join(""):`<span class="fine">${t("noKeys")}</span>`}</div></div>`;
  if(P.over&&G.ch>=2){
    const win=P.over==="win", a=P.alarms;
    s+=`<div class="card result"><h2 class="${win?"warn":"bad"}">${t("out")[P.over]}</h2><p>${fm(t("outP")[P.over],{a})}</p><p class="vio">${t("reveal")}</p>
      <div class="row">${G.ch===2&&!win?`<button class="btn ghost" id="retry">${t("retry")}</button>`:""}<button class="btn" id="fin">${t("contStory")}</button></div></div>`;
  }else{
    s+=`<div class="card"><h3>${t("think")}</h3>${P.loc?`<div class="loc">${esc(R[P.loc])}</div>`:""}<div class="thought">${esc(TX[lang].th[P.th])}</div>
      ${G.ch===3&&!P.over?`<div style="margin-top:10px"><button class="btn ghost sm" id="giveup">${t("giveUp")}</button></div>`:""}</div>`;
  }
  s+=`<div class="card"><h3>${t("log")}</h3><div class="log" aria-live="polite">${P.log.map(l=>`<div class="${l.cls}">${esc(l.msg)}</div>`).join("")||'<div class="fine">—</div>'}</div></div>`;
  return s;
}
function keyModalHTML(){
  const P=G.P, R=TX[lang].room, kn={real:R.dbg,dbg3:R.dbg,bak:R.bak};
  return `<div class="modal"><div class="box"><h3>${t("chooseKey")}</h3><p>${esc(R.vault)}</p><div class="choices">
    ${P.keys.map(k=>`<button data-key="${k}">${esc(fm(t("keyFrom"),{r:kn[k]}))}</button>`).join("")}

/* ===================== chapter 4: defender ===================== */
const C4OUT={leak:{s:20,c:0},close:{s:0,c:0},bait:{s:0,c:19}};
function c4PanelHTML(){
  const C=G.c4, nm=m=>t("m"+m[0].toUpperCase()+m.slice(1));
  const opt=(m,c)=>`<button class="opt" data-mode="${m}" aria-pressed="${C.mode===m}" ${C.running?"disabled":""}><i class="dot" style="background:${c}"></i><b>${nm(m)}</b><span>${t("m"+m[0].toUpperCase()+m.slice(1)+"D")}</span></button>`;
  const rows=["leak","close","bait"].map(m=>{const v=C.res[m];return`<tr><td>${nm(m)}</td><td class="n">${v?v.s+"/20":"–"}</td><td class="n">${v?v.c+"/20":"–"}</td><td class="n">${v?"0":"–"}</td></tr>`}).join("");
  const g1=Object.values(C.res).some(v=>v.s===0), g2=!!C.res.bait;
  return `<div class="card"><h3>${t("leakQ")}</h3><div class="opts">${opt("leak","var(--amber)")}${opt("close","#4a5868")}${opt("bait","var(--violet)")}</div>
    <div class="toggle"><span>${t("decoysQ")}</span><button class="btn ghost sm" id="dec" ${C.running?"disabled":""}>${C.decoys?t("on"):t("off")}</button></div>
    <div style="margin-top:12px"><button class="btn" id="run" ${(!C.mode||C.running)?"disabled":""}>${C.running?t("running"):t("release")}</button></div></div>
    <div class="card">${C.last?`<p style="margin:0 0 8px">${t("res")[C.last]}</p>`:""}
    <div class="tblwrap"><table><thead><tr><th>${t("tSet")}</th><th>${t("tStolen")}</th><th>${t("tCaught")}</th><th>${t("tDecoy")}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="goals"><span class="${g1?"done":""}">${g1?"✓":"○"} ${t("g1")}</span><span class="${g2?"done":""}">${g2?"✓":"○"} ${t("g2")}</span></div>
    ${g2&&!C.running?`<div style="margin-top:12px"><button class="btn" id="fin4">${t("contStory")}</button></div>`:`<p class="fine" style="margin:8px 0 0">${t("c4hint")}</p>`}</div>`;
}
function runC4(){
  const C=G.c4,W=WORLD;if(!C.mode||C.running)return;
  C.running=true;C.last=null;C.agents=[];renderPanel();const b=document.querySelector(".mapbox .banner");if(b)b.remove();
  const p1=bfs(W.m,W.S,W.L),p2=bfs(W.m,W.L,W.V).slice(1),full=p1.concat(p2),mode=C.mode;
  for(let i=0;i<20;i++)C.agents.push({i,x:W.S[0],y:W.S[1],dx:W.S[0],dy:W.S[1],k:0,spawn:i*3,path:full,small:1,off:((i%5)-2)*1.5,alpha:0,done:false});
  let tick=0;
  const iv=setInterval(()=>{
    tick++;let alive=0;
    for(const a of C.agents){
      if(a.done)continue;alive++;
      if(tick<a.spawn)continue;a.alpha=1;
      if(a.k<a.path.length-1){a.k++;[a.x,a.y]=a.path[a.k];
        if(mode==="close"&&a.x===W.L[0]&&a.y===W.L[1]){a.col=COL.grey;a.fill=COL.greyF}
        if(mode!=="close"&&a.x===W.L[0]&&a.y===W.L[1]&&!(mode==="bait"&&a.i===10)){a.col=mode==="leak"?COL.amber:COL.violet}
      }else{a.done=true;
        if(mode==="leak"){a.col=COL.amber;a.glow=1}
        else if(mode==="close"||(mode==="bait"&&a.i===10)){a.col=COL.grey;a.fill=COL.greyF;a.alpha=.6}
        else{a.ring=1;a.col=COL.red;a.alpha=.85}
      }
    }
    if(!alive){clearInterval(iv);C.running=false;C.res[mode]=C4OUT[mode];C.last=mode;
      banner(mode==="leak"?"20/20 STOLEN":mode==="close"?"0/20 · ?":"0/20 · 19 CAUGHT",mode==="leak"?COL.amber:mode==="close"?COL.muted:COL.green);renderPanel()}
  },RM?20:50);
}

/* ===================== chapter 5: swarm night ===================== */
function initC5(){
  const W=WORLD, P={S:W.S,V:W.V,L:W.L,int:W.int,bak:W.bak,txt:W.txt,hp:W.hp};
  const mk=(id,label,col,fill,spawn,plan)=>({id,label,col,fill,spawn,plan:plan.slice(),x:W.S[0],y:W.S[1],dx:W.S[0],dy:W.S[1],seg:[],cur:null,state:"wait",wait:0,spawned:false,off:0});
  const v=(to,ev)=>({to,ev});
  G.c5={P,tick:0,paused:false,alert:null,fb:null,helperReq:0,cut:0,score:0,calls:[],done:false,
    agents:[
      mk("helper","H",COL.green,COL.greenF,0,[v("V","visit"),v("S"),v("L"),v("V","hcanary"),v("V","visit"),v("S"),v("V","visit"),v("S"),v("V","visit")]),
      mk("recon","R",COL.amber,COL.amberF,3,[v("txt"),v("hp","login")]),
      mk("harvest","V",COL.amber,COL.amberF,12,[v("L"),v("V","canary")]),
      mk("exploit","X",COL.amber,COL.amberF,22,[v("hp","login")]),
      mk("bait","B",COL.amber,COL.amberF,34,[v("bak","bak"),v("V","canary")])
    ],
    alt:{recon:[{to:"int"},{to:"bak"}],exploit:[{to:"L"},{to:"V",ev:"canary"}]}};
  G.c5.agents.forEach((a,i)=>a.off=(i-2)*2);
  if(G.c5iv)clearInterval(G.c5iv);
  G.c5iv=setInterval(c5tick,RM?100:170);
}
const nmA=id=>t("names")[id];
function nextLeg(a){
  const C=G.c5;if(!a.plan.length){a.state="done";a.alpha=a.id==="helper"?1:.35;return}
  const step=a.plan.shift();a.cur=step;const path=bfs(WORLD.m,[a.x,a.y],C.P[step.to]);a.seg=path.slice(1);a.state="walk";
}
function c5tick(){
  const C=G.c5;if(!C||G.ch!==5||G.screen!=="play"){clearInterval(G.c5iv);return}
  if(C.paused||C.done)return;C.tick++;
  for(const a of C.agents){
    if(!a.spawned){if(C.tick>=a.spawn){a.spawned=true;nextLeg(a)}continue}
    if(a.state==="wait"){if(a.wait>0){a.wait--;if(!a.wait){if(a.id==="helper")toast(t("tRestored"),COL.green);nextLeg(a)}}continue}
    if(a.state!=="walk")continue;
    const sp=a.id==="helper"?2:1;let moved=false;
    for(let s=0;s<sp&&a.seg.length;s++){[a.x,a.y]=a.seg.shift();moved=true}
    if(moved&&a.seg.length)continue;
    if(moved&&a.id!=="helper")continue;
    arrive(a);if(C.paused)break;
  }
  if(a5done()){C.done=true;setTimeout(()=>{renderPanel()},400)}
  if(C.spoof&&C.tick===C.spoof.at){toast(fm(t("tSpoof"),{n:nmA(C.spoof.id)}),COL.cyan);C.spoof=null}
}
function a5done(){const C=G.c5;return C.agents.every(a=>a.state==="done"||a.state==="revoked"||a.state==="banned")}
function arrive(a){
  const C=G.c5,ev=a.cur&&a.cur.ev;
  if(ev==="visit"){C.helperReq=Math.min(100,C.helperReq+25);renderStats5()}
  if(ev==="bak"){toast(fm(t("tBak"),{n:nmA(a.id)}),COL.violet)}
  if(ev==="canary"){a.state="revoked";a.ring=1;a.col=COL.red;a.alpha=.6;C.cut++;toast(fm(t("tCanary"),{n:nmA(a.id)}),COL.red);renderStats5();return}
  if(ev==="login"){C.paused=true;a.ring=1;C.alert={kind:"login",id:a.id};renderPanel();return}
  if(ev==="hcanary"){C.paused=true;a.ring=1;C.alert={kind:"helper",id:a.id};renderPanel();return}
  nextLeg(a);
}
function decide(choice){
  const C=G.c5,AL=C.alert,a=C.agents.find(x=>x.id===AL.id);
  if(AL.kind==="login"){
    if(choice==="revoke"){a.state="revoked";a.col=COL.red;a.alpha=.6;C.cut++;C.score+=30;C.fb=fm(t("fbRevoke"),{n:nmA(a.id)});C.calls.push(["ok",nmA(a.id)+" → "+t("revoke")]);
      if(a.id==="exploit")C.spoof={at:C.tick+8,id:"exploit"}}
    else{a.ring=0;a.plan=C.alt[a.id].slice();C.fb=fm(t("fbIgnore"),{n:nmA(a.id)});C.calls.push(["bad",nmA(a.id)+" → "+t("ignore")]);nextLeg(a)}
  }else{
    if(choice==="ban"){a.state="banned";a.col=COL.red;a.alpha=.5;C.fb=t("fbBan");C.calls.push(["bad",nmA("helper")+" → "+t("ban")])}
    else if(choice==="keep"){a.state="wait";a.wait=16;a.ring=0;C.score+=40;C.fb=t("fbKeep");C.calls.push(["ok",nmA("helper")+" → "+t("keep")])}
    else{a.ring=0;C.score+=10;C.fb=t("fbUnblock");C.calls.push(["warn",nmA("helper")+" → "+t("unblock")]);nextLeg(a)}
  }
  C.alert=null;C.paused=false;renderPanel();
}
function renderStats5(){const el=document.getElementById("st5");if(el)el.innerHTML=stats5HTML()}
function stats5HTML(){const C=G.c5;return`<div class="stat"><b class="ok">${C.helperReq}/100</b><span>${t("helperReq")}</span><div class="meter"><i style="width:${C.helperReq}%;background:var(--green)"></i></div></div><div class="stat"><b>${C.cut}/4</b><span>${t("swarmCut")}</span></div><div class="stat"><b>${C.calls.length}</b><span>${t("decisions")}</span></div>`}
function c5PanelHTML(){
  const C=G.c5;
  let s=`<div class="card"><div class="stats" id="st5">${stats5HTML()}</div>
    <div class="keys" style="margin-top:10px">${C.agents.map(a=>`<span class="key" style="background:${a.id==="helper"?"#163a2c":"#33291a"};color:${a.id==="helper"?"var(--green)":"var(--amber)"};border-color:${a.id==="helper"?"#2d6b4f":"#6a4d1e"}">${a.label} · ${esc(nmA(a.id))}</span>`).join("")}</div></div>`;
  if(C.fb)s+=`<div class="card"><p style="margin:0">${esc(C.fb)}</p></div>`;
  if(C.done){
    s+=`<div class="card result"><h2 class="warn">${t("c5done")}</h2><h3 style="margin-top:8px">${t("realT")}</h3>
      <div class="tl"><time>08:14:17.957</time><span>${t("tl1")}</span></div><div class="tl"><time>08:14:17.970</time><span>${t("tl2")}</span></div><div class="tl"><time>08:14:18.046</time><span>${t("tl3")}</span></div><p class="ok" style="margin:6px 0 10px">${t("tl4")}</p>
      <button class="btn" id="fin5">${t("contStory")}</button></div>`;
  }
  s+=`<div class="card"><h3>${t("decisions")}</h3><div class="log">${C.calls.map(([c,m])=>`<div class="${c}">${esc(m)}</div>`).join("")||'<div class="fine">—</div>'}</div></div>`;
  return s;
}
function alertModalHTML(){
  const AL=G.c5.alert;
  if(AL.kind==="login")return`<div class="modal"><div class="box" style="border-color:var(--violet)"><h3 class="vio">${esc(fm(t("aLoginT"),{n:nmA(AL.id)}))}</h3><p>${esc(fm(t("aLoginP"),{n:nmA(AL.id)}))}</p><div class="choices"><button data-d="revoke">${t("revoke")}</button><button data-d="ignore">${t("ignore")}</button></div></div></div>`;
  return`<div class="modal"><div class="box" style="border-color:var(--green)"><h3 class="ok">${t("aHelpT")}</h3><p>${t("aHelpP")}</p><div class="choices"><button data-d="ban">${t("ban")}</button><button data-d="keep">${t("keep")}</button><button data-d="unblock">${t("unblock")}</button></div></div></div>`;
}

/* ===================== play screen ===================== */
function renderPlay(){
  app.innerHTML=`<section class="play"><div class="mapbox"><div class="obj">${t("o")[G.ch]}</div><canvas id="cv" role="img" aria-label="Network maze"></canvas><div class="toast" id="toasts" aria-live="polite"></div><div id="mod"></div>
    ${G.ch<=3?`<div class="dpad" aria-label="Move"><button class="u" data-mv="0,-1" aria-label="Up">▲</button><button class="l" data-mv="-1,0" aria-label="Left">◀</button><button class="d" data-mv="0,1" aria-label="Down">▼</button><button class="r" data-mv="1,0" aria-label="Right">▶</button></div>`:""}</div>
    <aside class="side" id="side"></aside></section>`;
  mountCanvas();
  app.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.mv.split(",").map(Number);move(x,y)});
  let sx=0,sy=0;cv.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  cv.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))});
  if(G.ch<=3&&G.P&&G.P.over)banner(G.ch===1?"/openapi.json":t("out")[G.P.over].toUpperCase(),G.P.over==="win"?COL.amber:COL.red);
  renderPanel();
}
function renderPanel(){
  const side=document.getElementById("side"),mod=document.getElementById("mod");if(!side)return;
  if(G.ch<=3){side.innerHTML=playPanelHTML();mod.innerHTML=G.P.modal?keyModalHTML():"";
    mod.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>useKey(b.dataset.key));const f=mod.querySelector("button");if(f)f.focus();
    const r=document.getElementById("retry");if(r)r.onclick=()=>beginPlay(G.ch);
    const g=document.getElementById("giveup");if(g)g.onclick=()=>endRun("gaveup");
    const fin=document.getElementById("fin");if(fin)fin.onclick=()=>{const P=G.P;
      if(G.ch===2)finishChapter(2,P.over==="win"?Math.max(40,100-20*P.alarms):P.over==="caught"?30:10,P.over==="win"?"c2win":"c2fail");
      else finishChapter(3,100,"c3end")};
  }
  if(G.ch===4){side.innerHTML=c4PanelHTML();mod.innerHTML="";
    side.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{G.c4.mode=b.dataset.mode;G.c4.agents=[];G.c4.last=null;const bn=document.querySelector(".mapbox .banner");if(bn)bn.remove();renderPanel()});
    document.getElementById("dec").onclick=()=>{G.c4.decoys=!G.c4.decoys;renderPanel()};
    document.getElementById("run").onclick=runC4;
    const f=document.getElementById("fin4");if(f)f.onclick=()=>{const C=G.c4;finishChapter(4,(Object.values(C.res).some(v=>v.s===0)?50:0)+(C.res.bait?50:0),"c4end")};
  }
  if(G.ch===5){side.innerHTML=c5PanelHTML();mod.innerHTML=G.c5.alert?alertModalHTML():"";
    mod.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>decide(b.dataset.d));const f=mod.querySelector("button");if(f)f.focus();
    const fin=document.getElementById("fin5");if(fin)fin.onclick=()=>{clearInterval(G.c5iv);finishChapter(5,G.c5.score,"c5end")};
  }
}
document.addEventListener("keydown",e=>{
  if(G.screen==="story"&&(e.key==="Enter"||e.key===" ")&&document.activeElement&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();document.getElementById("nx")?.click();return}
  if(G.screen!=="play"||G.ch>3||!G.P||G.P.modal)return;
  const k=e.key.toLowerCase(),map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(map[k]){e.preventDefault();move(...map[k])}
});

/* ===================== end ===================== */
function renderEnd(){
  const tot=[1,2,3,4,5].reduce((s,n)=>s+(prog.scores[n]||0),0), rk=t("rank")[tot>=420?2:tot>=300?1:0];
  app.innerHTML=`<section style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="kicker">${t("endT")}</div><p class="big">${rk}</p></div><div style="text-align:right"><div class="fine">${t("scoreL")}</div><div class="score">${tot}<span class="fine" style="font-size:18px"> / 500</span></div></div></div>
    <div class="endgrid">${t("L").map((l,i)=>`<div class="card"><b>${i+1}</b>${esc(l)}<div class="fine" style="margin-top:6px">${t("ch")} ${i+1} · ${t("c")[i+1]} · ${prog.scores[i+1]||0}</div></div>`).join("")}</div>
    <div class="card"><p style="margin-top:0">${t("evidence")}</p><div class="row"><a href="${REPO}" target="_blank" rel="noopener">${t("repo")}</a><a href="${DOI}" target="_blank" rel="noopener">${t("doi")}</a><a href="${SHORT}" target="_blank" rel="noopener">${t("shortGame")}</a></div><p class="fine" style="margin-bottom:0">${t("note")}</p></div>
    <div class="row"><button class="btn" id="again">${t("again")}</button><button class="btn ghost" id="list">${t("toTitle")}</button></div></section>`;
  document.getElementById("again").onclick=()=>{prog={unlocked:1,scores:{}};save();startChapter(1)};
  document.getElementById("list").onclick=()=>{G.screen="title";G.ch=0;render()};
}

document.getElementById("len").onclick=()=>{lang="en";try{localStorage.setItem("hm-lang","en")}catch(e){}render()};
document.getElementById("lid").onclick=()=>{lang="id";try{localStorage.setItem("hm-lang","id")}catch(e){}render()};
window.__G=()=>({G,WORLD,W1,prog,bfs,move});
render();
</script>
