{
  "device.node_id": "lab-opencanary-1",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],
  "ftp.enabled": false,
  "git.enabled": false,
  "http.enabled": true,
  "https.enabled": false,
  "httpproxy.enabled": false,
  "llmnr.enabled": false,
  "mssql.enabled": false,
  "mysql.enabled": false,
  "ntp.enabled": false,
  "portscan.enabled": false,
  "rdp.enabled": false,
  "redis.enabled": false,
  "sip.enabled": false,
  "smb.enabled": false,
  "snmp.enabled": false,
  "ssh.enabled": false,
  "tcpbanner.enabled": false,
  "telnet.enabled": false,
  "tftp.enabled": false,
  "vnc.enabled": false,
  "http.port": 8081,
  "http.banner": "Apache/2.4.58 (Ubuntu)",
  "http.skin": "nasLogin",
  "http.log_unimplemented_method_requests": false,
  "http.log_redirect_request": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "lab_adapter": {
          "class": "opencanary.logger.WebhookHandler",
          "url": "http://canary-adapter:4319/opencanary",
          "method": "POST",
          "data": {
            "message": "%(message)s"
          },
          "status_code": 202,
          "headers": {
            "Content-Type": "application/json"
          },
          "timeout": 2
        }
      }
    }
  }
}
